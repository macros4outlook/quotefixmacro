name: Check CHANGELOG.md

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'
      - '.github/workflows/heylogs.yml'
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - '.github/workflows/heylogs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heylogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check CHANGELOG.md with heylogs
        uses: jbangdev/jbang-action@cc5515892c9ab66bc1f9644425c8b28003aed1fe # v0.143.0
        with:
          script: com.github.nbbrd.heylogs:heylogs-cli:0.19.1:bin
          scriptargs: "check --format github-actions"
