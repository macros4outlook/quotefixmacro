name: Check VBA syntax

on:
  push:
    branches:
      - main
    paths:
      - '**.bas'
      - '**.cls'
      - '.gitattributes'
      - '.github/workflows/vba-lint.yml'
  pull_request:
    paths:
      - '**.bas'
      - '**.cls'
      - '.gitattributes'
      - '.github/workflows/vba-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vba-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install VBA-Linter
        # Pinned to a commit, because the latest release (0.0.4) does not work with current antlr4-vba
        run: pip install "git+https://github.com/Beakerboy/VBA-Linter.git@714cfb964b7d387d7bd62160a0e4ec5f0f041ee9"
      - name: Check that VBA code parses
        run: python -m vba_linter .
